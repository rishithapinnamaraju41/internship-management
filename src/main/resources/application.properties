# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=internship-management
server.port=${PORT:8080}

# REMOVE CONTEXT PATH FOR EASIER ACCESS
# server.servlet.context-path=/api

# ============================================
# STATIC RESOURCE CONFIGURATION
# ============================================
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ============================================
# THYMELEAF CONFIGURATION (Disable for static HTML)
# ============================================
spring.thymeleaf.check-template-location=false
spring.thymeleaf.enabled=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3307/internship_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=your-256-bit-secret-key-for-jwt-which-should-be-long-enough-and-secure-please-change-this-in-production-123456789
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================
EMAIL CONFIGURATION (Optional)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================
# APP CONFIGURATION
# ============================================
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.com.appticode=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n