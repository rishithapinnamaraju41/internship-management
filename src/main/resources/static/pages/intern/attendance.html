<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Intern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-graduation-cap"></i>
            <span>InternshipMS</span>
        </div>
        <div class="sidebar-user">
            <div class="avatar">I</div>
            <div class="user-info">
                <div class="name" id="userName">Intern</div>
                <div class="role">Intern</div>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="/pages/intern/dashboard.html" class="menu-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="/pages/intern/tasks.html" class="menu-item"><i class="fas fa-tasks"></i> My Tasks</a>
            <a href="/pages/intern/attendance.html" class="menu-item active"><i class="fas fa-clock"></i> Attendance</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="menu-item" onclick="api.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div class="top-navbar">
            <div>
                <button class="btn btn-link d-md-none" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <span class="page-title">Attendance</span>
            </div>
            <div class="nav-actions"><span class="text-muted" id="currentTime"></span></div>
        </div>

        <!-- Quick Actions -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card text-center p-4 cursor-pointer" onclick="checkIn()">
                    <i class="fas fa-sign-in-alt fa-3x text-primary"></i>
                    <h5 class="mt-3">Check In</h5>
                    <p class="text-muted small">Start your work day</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-center p-4 cursor-pointer" onclick="checkOut()">
                    <i class="fas fa-sign-out-alt fa-3x text-danger"></i>
                    <h5 class="mt-3">Check Out</h5>
                    <p class="text-muted small">End your work day</p>
                </div>
            </div>
        </div>

        <!-- Attendance Summary -->
        <div class="row g-4 mb-4">
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-label">Total Days</div>
                    <div class="stat-value" id="totalDays">0</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-label">Present</div>
                    <div class="stat-value" id="presentDays">0</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-label">Absent</div>
                    <div class="stat-value" id="absentDays">0</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-label">Attendance %</div>
                    <div class="stat-value" id="attendancePercent">0%</div>
                </div>
            </div>
        </div>

        <!-- Attendance History -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Attendance History</span>
                <div>
                    <input type="date" id="attendanceStartDate" class="form-control form-control-sm d-inline-block w-auto">
                    <span class="mx-1">to</span>
                    <input type="date" id="attendanceEndDate" class="form-control form-control-sm d-inline-block w-auto">
                    <button class="btn btn-sm btn-primary ms-2" onclick="filterAttendance()">Filter</button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-container">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th><th>Hours</th></tr></thead>
                        <tbody id="attendanceHistory"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/intern-attendance.js"></script>
</body>
</html>
