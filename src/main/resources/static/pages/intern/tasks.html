<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - Intern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-graduation-cap"></i>
            <span>InternshipMS</span>
        </div>
        <div class="sidebar-user">
            <div class="avatar">I</div>
            <div class="user-info">
                <div class="name" id="userName">Intern</div>
                <div class="role">Intern</div>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="/pages/intern/dashboard.html" class="menu-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="/pages/intern/tasks.html" class="menu-item active"><i class="fas fa-tasks"></i> My Tasks</a>
            <a href="/pages/intern/attendance.html" class="menu-item"><i class="fas fa-clock"></i> Attendance</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="menu-item" onclick="api.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div class="top-navbar">
            <div>
                <button class="btn btn-link d-md-none" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <span class="page-title">My Tasks</span>
            </div>
            <div class="nav-actions"><span class="text-muted" id="currentTime"></span></div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>All Tasks</span>
                <div>
                    <select id="taskFilter" class="form-control form-control-sm d-inline-block w-auto" onchange="filterTasks()">
                        <option value="all">All</option>
                        <option value="PENDING">Pending</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-container">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr><th>Task</th><th>Due Date</th><th>Priority</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="internTasks"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Submit Task Modal -->
    <div class="modal fade" id="submitTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Submit Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="submitTaskForm">
                        <input type="hidden" id="submitTaskId">
                        <div class="mb-3">
                            <label class="form-label">Submission Text</label>
                            <textarea id="submissionText" class="form-control" rows="4" placeholder="Describe your work..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Attachment URL (Optional)</label>
                            <input type="text" id="attachmentUrl" class="form-control" placeholder="https://example.com/file.pdf">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="submitTask()">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/intern-tasks.js"></script>
</body>
</html>
