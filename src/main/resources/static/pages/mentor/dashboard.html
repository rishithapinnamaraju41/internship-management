<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-graduation-cap"></i>
            <span>InternshipMS</span>
        </div>
        <div class="sidebar-user">
            <div class="avatar">M</div>
            <div class="user-info">
                <div class="name" id="userName">Mentor</div>
                <div class="role">Mentor</div>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="/pages/mentor/dashboard.html" class="menu-item active"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="/pages/mentor/interns.html" class="menu-item"><i class="fas fa-users"></i> My Interns</a>
            <a href="/pages/mentor/tasks.html" class="menu-item"><i class="fas fa-tasks"></i> Tasks</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="menu-item" onclick="api.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div class="top-navbar">
            <div>
                <button class="btn btn-link d-md-none" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <span class="page-title">Mentor Dashboard</span>
            </div>
            <div class="nav-actions"><span class="text-muted" id="currentTime"></span></div>
        </div>

        <!-- Stats -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-label">My Interns</div>
                            <div class="stat-value" id="myInterns">0</div>
                        </div>
                        <div class="stat-icon blue"><i class="fas fa-user-graduate"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-label">Tasks Assigned</div>
                            <div class="stat-value" id="tasksAssigned">0</div>
                        </div>
                        <div class="stat-icon orange"><i class="fas fa-tasks"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-label">Pending Submissions</div>
                            <div class="stat-value" id="pendingSubmissions">0</div>
                        </div>
                        <div class="stat-icon red"><i class="fas fa-clock"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- My Interns -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                My Interns
                <a href="/pages/mentor/interns.html" class="btn btn-sm btn-primary">View All</a>
            </div>
            <div class="card-body p-0">
                <div class="table-container">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Name</th><th>Department</th><th>Status</th><th>Rating</th></tr></thead>
                        <tbody id="mentorInterns"><tr><td colspan="4" class="text-center text-muted">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/mentor.js"></script>
</body>
</html>
