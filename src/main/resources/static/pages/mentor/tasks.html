<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Mentor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-graduation-cap"></i>
            <span>InternshipMS</span>
        </div>
        <div class="sidebar-user">
            <div class="avatar">M</div>
            <div class="user-info">
                <div class="name" id="userName">Mentor</div>
                <div class="role">Mentor</div>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="/pages/mentor/dashboard.html" class="menu-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="/pages/mentor/interns.html" class="menu-item"><i class="fas fa-users"></i> My Interns</a>
            <a href="/pages/mentor/tasks.html" class="menu-item active"><i class="fas fa-tasks"></i> Tasks</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="menu-item" onclick="api.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div class="top-navbar">
            <div>
                <button class="btn btn-link d-md-none" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <span class="page-title">Task Management</span>
            </div>
            <div class="nav-actions"><span class="text-muted" id="currentTime"></span></div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>All Tasks</span>
                <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                    <i class="fas fa-plus"></i> Create Task
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-container">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr><th>Title</th><th>Batch</th><th>Due Date</th><th>Priority</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="mentorTasks"><tr><td colspan="6" class="text-center text-muted">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Task Modal -->
    <div class="modal fade" id="createTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createTaskForm">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" id="taskTitle" class="form-control" placeholder="Task title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="taskDescription" class="form-control" rows="3" placeholder="Description"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Batch ID</label>
                            <input type="text" id="taskBatchId" class="form-control" placeholder="Batch ID">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Due Date</label>
                            <input type="date" id="taskDueDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total Points</label>
                            <input type="number" id="taskTotalPoints" class="form-control" value="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Priority</label>
                            <select id="taskPriority" class="form-control">
                                <option value="LOW">Low</option>
                                <option value="MEDIUM" selected>Medium</option>
                                <option value="HIGH">High</option>
                                <option value="URGENT">Urgent</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createTask()">Create Task</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/mentor-tasks.js"></script>
</body>
</html>
