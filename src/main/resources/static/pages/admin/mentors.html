<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentors - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-graduation-cap"></i>
            <span>InternshipMS</span>
        </div>
        <div class="sidebar-user">
            <div class="avatar">A</div>
            <div class="user-info">
                <div class="name" id="userName">Admin</div>
                <div class="role">Administrator</div>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="/pages/admin/dashboard.html" class="menu-item">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="/pages/admin/users.html" class="menu-item">
                <i class="fas fa-users"></i> Users
                <span class="badge" id="userCount">0</span>
            </a>
            <a href="/pages/admin/mentors.html" class="menu-item active">
                <i class="fas fa-chalkboard-teacher"></i> Mentors
                <span class="badge" id="mentorCount">0</span>
            </a>
            <a href="/pages/admin/interns.html" class="menu-item">
                <i class="fas fa-user-graduate"></i> Interns
            </a>
            <a href="/pages/admin/batches.html" class="menu-item">
                <i class="fas fa-layer-group"></i> Batches
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="menu-item" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navbar -->
        <div class="top-navbar">
            <div>
                <button class="btn btn-link d-md-none" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="page-title">Mentor Management</span>
            </div>
            <div class="nav-actions">
                <span class="text-muted" id="currentTime"></span>
            </div>
        </div>

        <!-- Mentor Management Card -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span><i class="fas fa-chalkboard-teacher me-2"></i>All Mentors</span>
                <div class="d-flex gap-2 flex-wrap">
                    <div class="input-group input-group-sm" style="width: 250px;">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search mentors...">
                        <button class="btn btn-outline-secondary" type="button" onclick="searchMentors(document.getElementById('searchInput').value)">
                            <i class="fas fa-search"></i>
                        </button>
                        <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()" title="Clear search">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addMentorModal">
                        <i class="fas fa-plus"></i> Add Mentor
                    </button>
                    <button class="btn btn-sm btn-outline-success" onclick="exportMentors()">
                        <i class="fas fa-file-export"></i> Export
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Specialization</th>
                                <th>Experience</th>
                                <th>Interns</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="mentorsTable">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-4">
                                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                    Loading mentors...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <span id="paginationInfo">Showing 0 of 0 mentors</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" id="prevPage" disabled>
                        <i class="fas fa-chevron-left"></i> Prev
                    </button>
                    <span class="mx-2" id="pageInfo">Page 1 of 1</span>
                    <button class="btn btn-sm btn-outline-secondary" id="nextPage" disabled>
                        Next <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Mentor Modal -->
    <div class="modal fade" id="addMentorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-user-plus me-2"></i>Add New Mentor
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addMentorForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">User ID <span class="text-danger">*</span></label>
                                <input type="text" id="mentorUserId" class="form-control" placeholder="Enter existing user ID" required>
                                <small class="text-muted">Enter the User ID of an existing user</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Employee ID <span class="text-danger">*</span></label>
                                <input type="text" id="mentorEmployeeId" class="form-control" placeholder="Employee ID" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Name <span class="text-danger">*</span></label>
                                <input type="text" id="mentorName" class="form-control" placeholder="Full name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department</label>
                                <input type="text" id="mentorDepartment" class="form-control" placeholder="Department">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Specialization</label>
                                <input type="text" id="mentorSpecialization" class="form-control" placeholder="Specialization">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Experience (Years)</label>
                                <input type="number" id="mentorExperience" class="form-control" placeholder="Years of experience" min="0" value="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Max Interns <span class="text-danger">*</span></label>
                            <input type="number" id="mentorMaxInterns" class="form-control" value="5" min="1" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addMentor()">
                        <i class="fas fa-save me-1"></i> Add Mentor
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Mentor Modal -->
    <div class="modal fade" id="editMentorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-user-edit me-2"></i>Edit Mentor
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editMentorForm">
                        <input type="hidden" id="editMentorId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">User ID <span class="text-danger">*</span></label>
                                <input type="text" id="editMentorUserId" class="form-control" placeholder="Enter existing user ID" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Employee ID <span class="text-danger">*</span></label>
                                <input type="text" id="editMentorEmployeeId" class="form-control" placeholder="Employee ID" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Name <span class="text-danger">*</span></label>
                                <input type="text" id="editMentorName" class="form-control" placeholder="Full name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department</label>
                                <input type="text" id="editMentorDepartment" class="form-control" placeholder="Department">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Specialization</label>
                                <input type="text" id="editMentorSpecialization" class="form-control" placeholder="Specialization">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Experience (Years)</label>
                                <input type="number" id="editMentorExperience" class="form-control" placeholder="Years of experience" min="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Max Interns <span class="text-danger">*</span></label>
                            <input type="number" id="editMentorMaxInterns" class="form-control" min="1" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateMentor()">
                        <i class="fas fa-save me-1"></i> Update Mentor
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/admin-mentors.js"></script>
</body>
</html>
