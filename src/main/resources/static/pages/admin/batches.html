<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batches - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-graduation-cap"></i>
            <span>InternshipMS</span>
        </div>
        <div class="sidebar-user">
            <div class="avatar">A</div>
            <div class="user-info">
                <div class="name" id="userName">Admin</div>
                <div class="role">Administrator</div>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="/pages/admin/dashboard.html" class="menu-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="/pages/admin/users.html" class="menu-item"><i class="fas fa-users"></i> Users</a>
            <a href="/pages/admin/mentors.html" class="menu-item"><i class="fas fa-chalkboard-teacher"></i> Mentors</a>
            <a href="/pages/admin/interns.html" class="menu-item"><i class="fas fa-user-graduate"></i> Interns</a>
            <a href="/pages/admin/batches.html" class="menu-item active"><i class="fas fa-layer-group"></i> Batches</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="menu-item" onclick="api.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div class="top-navbar">
            <div>
                <button class="btn btn-link d-md-none" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <span class="page-title">Batch Management</span>
            </div>
            <div class="nav-actions"><span class="text-muted" id="currentTime"></span></div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>All Batches</span>
                <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addBatchModal">
                    <i class="fas fa-plus"></i> Create Batch
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-container">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr><th>Name</th><th>Code</th><th>Start Date</th><th>End Date</th><th>Capacity</th><th>Enrolled</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="batchesTable"><tr><td colspan="8" class="text-center text-muted">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Batch Modal -->
    <div class="modal fade" id="addBatchModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Batch</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addBatchForm">
                        <div class="mb-3">
                            <label class="form-label">Batch Name</label>
                            <input type="text" id="batchName" class="form-control" placeholder="Batch name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Batch Code</label>
                            <input type="text" id="batchCode" class="form-control" placeholder="Batch code" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="batchDescription" class="form-control" rows="2" placeholder="Description"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" id="batchStartDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" id="batchEndDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Max Capacity</label>
                            <input type="number" id="batchMaxCapacity" class="form-control" value="20" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addBatch()">Create Batch</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/admin-batches.js"></script>
</body>
</html>
