<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interns - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-graduation-cap"></i>
            <span>InternshipMS</span>
        </div>
        <div class="sidebar-user">
            <div class="avatar">A</div>
            <div class="user-info">
                <div class="name" id="userName">Admin</div>
                <div class="role">Administrator</div>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="/pages/admin/dashboard.html" class="menu-item">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="/pages/admin/users.html" class="menu-item">
                <i class="fas fa-users"></i> Users
                <span class="badge" id="userCount">0</span>
            </a>
            <a href="/pages/admin/mentors.html" class="menu-item">
                <i class="fas fa-chalkboard-teacher"></i> Mentors
                <span class="badge" id="mentorCount">0</span>
            </a>
            <a href="/pages/admin/interns.html" class="menu-item active">
                <i class="fas fa-user-graduate"></i> Interns
                <span class="badge" id="internCount">0</span>
            </a>
            <a href="/pages/admin/batches.html" class="menu-item">
                <i class="fas fa-layer-group"></i> Batches
                <span class="badge" id="batchCount">0</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="menu-item" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navbar -->
        <div class="top-navbar">
            <div>
                <button class="btn btn-link d-md-none" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="page-title">Intern Management</span>
            </div>
            <div class="nav-actions">
                <span class="text-muted" id="currentTime"></span>
            </div>
        </div>

        <!-- Intern Management Card -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span><i class="fas fa-user-graduate me-2"></i>All Interns</span>
                <div class="d-flex gap-2 flex-wrap">
                    <div class="input-group input-group-sm" style="width: 250px;">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search interns...">
                        <button class="btn btn-outline-secondary" type="button" onclick="searchInterns(document.getElementById('searchInput').value)">
                            <i class="fas fa-search"></i>
                        </button>
                        <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()" title="Clear search">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addInternModal">
                        <i class="fas fa-plus"></i> Add Intern
                    </button>
                    <button class="btn btn-sm btn-outline-success" onclick="exportInterns()">
                        <i class="fas fa-file-export"></i> Export
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Batch</th>
                                <th>Mentor</th>
                                <th>Status</th>
                                <th>Rating</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="internsTable">
                            <tr>
                                <td colspan="8" class="text-center text-muted py-4">
                                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                    Loading interns...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <span id="paginationInfo">Showing 0 of 0 interns</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" id="prevPage" disabled>
                        <i class="fas fa-chevron-left"></i> Prev
                    </button>
                    <span class="mx-2" id="pageInfo">Page 1 of 1</span>
                    <button class="btn btn-sm btn-outline-secondary" id="nextPage" disabled>
                        Next <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Intern Modal -->
    <div class="modal fade" id="addInternModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-user-plus me-2"></i>Add New Intern
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addInternForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">User <span class="text-danger">*</span></label>
                                <select id="internUserId" class="form-control" required>
                                    <option value="">Select User</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department</label>
                                <input type="text" id="internDepartment" class="form-control" placeholder="Department">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">University</label>
                                <input type="text" id="internUniversity" class="form-control" placeholder="University">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Degree</label>
                                <input type="text" id="internDegree" class="form-control" placeholder="Degree">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Graduation Year</label>
                                <input type="number" id="internGraduationYear" class="form-control" placeholder="2024" min="1900" max="2100">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status</label>
                                <select id="internStatus" class="form-control">
                                    <option value="ACTIVE">Active</option>
                                    <option value="COMPLETED">Completed</option>
                                    <option value="TERMINATED">Terminated</option>
                                    <option value="ON_HOLD">On Hold</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" id="internStartDate" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">End Date</label>
                                <input type="date" id="internEndDate" class="form-control">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Batch</label>
                                <select id="internBatchId" class="form-control">
                                    <option value="">Select Batch</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mentor</label>
                                <select id="internMentorId" class="form-control">
                                    <option value="">Select Mentor</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addIntern()">
                        <i class="fas fa-save me-1"></i> Add Intern
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Intern Modal -->
    <div class="modal fade" id="editInternModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-user-edit me-2"></i>Edit Intern
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editInternForm">
                        <input type="hidden" id="editInternId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">User <span class="text-danger">*</span></label>
                                <select id="editInternUserId" class="form-control" required>
                                    <option value="">Select User</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department</label>
                                <input type="text" id="editInternDepartment" class="form-control" placeholder="Department">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">University</label>
                                <input type="text" id="editInternUniversity" class="form-control" placeholder="University">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Degree</label>
                                <input type="text" id="editInternDegree" class="form-control" placeholder="Degree">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Graduation Year</label>
                                <input type="number" id="editInternGraduationYear" class="form-control" placeholder="2024" min="1900" max="2100">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status</label>
                                <select id="editInternStatus" class="form-control">
                                    <option value="ACTIVE">Active</option>
                                    <option value="COMPLETED">Completed</option>
                                    <option value="TERMINATED">Terminated</option>
                                    <option value="ON_HOLD">On Hold</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" id="editInternStartDate" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">End Date</label>
                                <input type="date" id="editInternEndDate" class="form-control">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Batch</label>
                                <select id="editInternBatchId" class="form-control">
                                    <option value="">Select Batch</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mentor</label>
                                <select id="editInternMentorId" class="form-control">
                                    <option value="">Select Mentor</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateIntern()">
                        <i class="fas fa-save me-1"></i> Update Intern
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/admin-interns.js"></script>
</body>
</html>
